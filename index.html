<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GROK Style AI</title>

<style>
/* ======== 全体 ======== */
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #0a0a1a, #000);
    color: #d0d0ff;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* ======== サイドバー ======== */
#sidebar {
    width: 240px;
    background: rgba(10, 10, 30, 0.9);
    border-right: 1px solid #222;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(6px);
}

#sidebar h2 {
    font-size: 22px;
    color: #7f5cff;
    margin-bottom: 25px;
    text-shadow: 0 0 12px #7f5cff;
}

.menu-item {
    padding: 12px;
    margin: 6px 0;
    background: rgba(20, 20, 40, 0.8);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid #2a2a4a;
    color: #b0aaff;
}

.menu-item:hover {
    background: rgba(40, 20, 80, 0.9);
    border-color: #8f5cff;
    color: #dcd2ff;
    box-shadow: 0 0 10px #8f5cff;
}

/* ======== メイン画面 ======== */
#main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: linear-gradient(135deg, #050510, #0a0a1a);
}

/* ======== チャット欄 ======== */
#chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    scroll-behavior: smooth;
}

/* ======== メッセージ ======== */
.message {
    max-width: 75%;
    padding: 14px 18px;
    margin: 12px 0;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.6;
    animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ユーザー（右） */
.user {
    background: linear-gradient(135deg, #5c5cff, #7f5cff);
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 0;
    box-shadow: 0 0 12px #7f5cff;
}

/* AI（左） */
.ai {
    background: rgba(20, 20, 40, 0.8);
    color: #d0d0ff;
    margin-right: auto;
    border-bottom-left-radius: 0;
    border: 1px solid #3a3a5a;
    box-shadow: 0 0 8px #3a3a5a;
}

/* システムメッセージ */
.sys {
    background: rgba(40, 40, 60, 0.6);
    color: #aaaaff;
    margin: 0 auto;
    text-align: center;
    font-size: 12px;
    border-radius: 6px;
    padding: 6px 10px;
}

/* ======== 入力欄 ======== */
#inputArea {
    display: flex;
    padding: 15px;
    background: rgba(10, 10, 30, 0.9);
    border-top: 1px solid #222;
    backdrop-filter: blur(6px);
}

#msg {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #050510;
    color: #d0d0ff;
    font-size: 15px;
}

button {
    margin-left: 10px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #5c5cff, #7f5cff);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 10px #7f5cff;
}

button:hover {
    background: linear-gradient(135deg, #7f5cff, #9f7cff);
    box-shadow: 0 0 14px #9f7cff;
}
</style>
</head>

<body>

<!-- ======== サイドバー ======== -->
<div id="sidebar">
    <h2>NEON CORE</h2>
    <div class="menu-item">新しいチャット</div>
    <div class="menu-item">学習データ</div>
    <div class="menu-item">設定</div>
</div>

<!-- ======== メイン画面 ======== -->
<div id="main">
    <div id="chat"></div>

    <div id="inputArea">
        <input id="msg" type="text" placeholder="メッセージを入力…">
        <button onclick="send()">送信</button>
    </div>
</div>

<script>
/* ======== 簡易AI（学習＋類似度） ======== */
let memory = JSON.parse(localStorage.getItem("grok_ai_memory") || "{}");
let waiting = null;

function tokenize(t){
    return t.toLowerCase().replace(/[。、！!？?]/g," ").split(" ").filter(x=>x);
}

function similarity(a,b){
    let A = tokenize(a), B = tokenize(b);
    let set = new Set([...A,...B]);
    let score = 0;
    set.forEach(w=>{
        let ca = A.filter(x=>x===w).length;
        let cb = B.filter(x=>x===w).length;
        score += Math.min(ca,cb);
    });
    return score / Math.max(A.length,B.length);
}

function aiReply(input){
    let best = null, bestScore = 0;
    for(let q in memory){
        let s = similarity(input,q);
        if(s > bestScore){
            bestScore = s;
            best = q;
        }
    }
    if(bestScore < 0.2){
        return {text:"理解できなかった…教えて？", teach:true};
    }
    return {text:memory[best], teach:false};
}

/* ======== UI ======== */
function addMessage(t,c){
    let chat = document.getElementById("chat");
    let div = document.createElement("div");
    div.className = "message " + c;
    div.textContent = t;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function send(){
    let msg = document.getElementById("msg");
    let text = msg.value.trim();
    if(!text) return;

    addMessage(text,"user");

    if(waiting){
        memory[waiting] = text;
        localStorage.setItem("grok_ai_memory",JSON.stringify(memory));
        addMessage("覚えた。","ai");
        waiting = null;
        msg.value = "";
        return;
    }

    let res = aiReply(text);
    addMessage(res.text,"ai");

    if(res.teach) waiting = text;

    msg.value = "";
}

document.getElementById("msg").addEventListener("keydown",e=>{
    if(e.key==="Enter") send();
});

addMessage("GROK AI 起動完了。何を知りたい？","ai");
</script>

</body>
</html>
