<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Modern Chat AI</title>

<style>
body {
    margin: 0;
    background: #e9eef3;
    font-family: "Segoe UI", sans-serif;
}

/* チャット全体 */
#chat {
    width: 100%;
    max-width: 700px;
    height: 80vh;
    margin: 20px auto;
    padding: 20px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow-y: auto;
    scroll-behavior: smooth;
}

/* メッセージ共通 */
.message {
    max-width: 75%;
    padding: 12px 16px;
    margin: 10px 0;
    border-radius: 15px;
    font-size: 16px;
    line-height: 1.4;
}

/* ユーザー側（右） */
.user {
    background: #0078ff;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 0;
}

/* AI側（左） */
.ai {
    background: #f1f3f5;
    color: #333;
    margin-right: auto;
    border-bottom-left-radius: 0;
}

/* 入力欄 */
#inputArea {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-width: 700px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    background: #ffffff;
    padding: 10px;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
}

#msg {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    margin-left: 10px;
    padding: 12px 20px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #005fcc;
}
</style>
</head>

<body>

<div id="chat"></div>

<div id="inputArea">
    <input id="msg" type="text" placeholder="メッセージを入力…">
    <button onclick="send()">送信</button>
</div>

<script>
// -----------------------------
// 学習データ
// -----------------------------
let memory = JSON.parse(localStorage.getItem("chat_memory") || "{}");

// -----------------------------
// 類似度計算（簡易）
// -----------------------------
function similarity(a, b) {
    a = a.toLowerCase();
    b = b.toLowerCase();
    let count = 0;
    for (let ch of a) {
        if (b.includes(ch)) count++;
    }
    return count / Math.max(a.length, b.length);
}

// -----------------------------
// AIの返答
// -----------------------------
function aiReply(input) {
    let bestKey = null;
    let bestScore = 0;

    for (let key in memory) {
        let score = similarity(input, key);
        if (score > bestScore) {
            bestScore = score;
            bestKey = key;
        }
    }

    if (bestScore < 0.2 || bestKey === null) {
        return "ごめん、まだよくわからない…教えてくれる？";
    }

    return memory[bestKey];
}

// -----------------------------
// メッセージ表示
// -----------------------------
function addMessage(text, cls) {
    let chat = document.getElementById("chat");
    let div = document.createElement("div");
    div.className = "message " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// -----------------------------
// 送信処理
// -----------------------------
let waitingForTeach = null;

function send() {
    let input = document.getElementById("msg").value;
    if (!input) return;

    addMessage(input, "user");

    let reply = aiReply(input);
    addMessage(reply, "ai");

    if (reply.includes("教えて")) {
        waitingForTeach = input;
    }

    document.getElementById("msg").value = "";
}

// Enterキー送信
document.getElementById("msg").addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

// -----------------------------
// 学習処理
// -----------------------------
document.getElementById("msg").addEventListener("input", function() {
    if (waitingForTeach !== null) {
        let teach = this.value;

        if (teach.endsWith("。") || teach.endsWith("！") || teach.endsWith("？")) {
            memory[waitingForTeach] = teach;
            localStorage.setItem("chat_memory", JSON.stringify(memory));

            addMessage("なるほど！覚えたよ！", "ai");

            waitingForTeach = null;
            this.value = "";
        }
    }
});
</script>

</body>
</html>
